services:
  backend:
    build: ./backend
    image: xerxes-backend
    env_file: backend/.env
    environment:
      XERXES_DATA_DIR: /data
      CODEX_HOME: /data/codex
    ports:
      - "8787:8787"
    volumes:
      - xerxes-data:/data
    restart: unless-stopped

  # Optional public HTTPS URL for Agora's custom-LLM callback:
  #   docker compose --profile tunnel up -d && docker compose logs tunnel | grep trycloudflare
  # then set PUBLIC_URL in backend/.env to that URL and `docker compose up -d backend`.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://backend:8787
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  xerxes-data:
